<svg width="854" height="180" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="50%"  stop-color="#0a3d1f"/>
      <stop offset="100%" stop-color="#00b04f"/>
    </linearGradient>
    <style>
      @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
      .title { animation: fadeIn 1.2s ease-in-out forwards; }
      .sub   { animation: fadeIn 1.6s ease-in-out forwards; }
    </style>
  </defs>

  <!-- Background fill -->
  <rect width="854" height="180" fill="url(#bg)"/>

  <!-- Wave shape at bottom -->
  <path d="M0 100 Q213 140 427 115 T854 135 L854 180 L0 180 Z" fill="#0d1117" opacity="0.5"/>
  <path d="M0 120 Q213 100 427 130 T854 110 L854 180 L0 180 Z" fill="#0d1117" opacity="0.6"/>

  <!-- "Deepak Kumar" in green -->
  <text
    x="50%" y="38%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="48"
    font-weight="700"
    fill="#00ff88"
    class="title"
  >Deepak Kumar</text>

  <!-- Subtitle in gold -->
  <text
    x="50%" y="64%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="17"
    font-weight="500"
    fill="#FFD700"
    class="sub"
  >Data Analyst | Where Data Meets Intelligence</text>
</svg>
